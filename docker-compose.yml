services:
  steamworkshopsync:
    image: ghcr.io/mrachini/steamworkshopsync:latest
    container_name: steamworkshopsync
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      ADMIN_PASSWORD: change-me
      # Behind a reverse proxy, list its address(es) so the login limiter sees real client IPs:
      # TRUST_PROXY: 172.16.0.0/12
    volumes:
      - ./data:/data
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
